# nginx site for the Redbox backend behind Cloudflare (Flexible SSL). See docs/deploy-linux.md.
#
# Cloudflare terminates HTTPS for the proxied (orange-cloud) names and connects to this host on plain HTTP port 80.
# This file routes those requests by host name:
#   the kiosk API names -> rb-cloudapi  (127.0.0.1:8080, compose.cloudflare.yaml)
#   admin.<domain>      -> rb-admin     (127.0.0.1:8443, ADMIN_TLS=false)
# The DNS-only names (updatesvc, iot, broker) do not come through here: kiosks connect to their ports directly.
#
# Install (Debian/Ubuntu nginx package):
#   sed 's/example\.net/your-domain.tld/g' redbox-cloudflare.conf | sudo tee /etc/nginx/sites-available/redbox
#   sudo ln -s /etc/nginx/sites-available/redbox /etc/nginx/sites-enabled/redbox
#   sudo rm /etc/nginx/sites-enabled/default        # this file has its own default_server
#   sudo nginx -t && sudo systemctl reload nginx

# Client addresses: Cloudflare puts the visitor's address in CF-Connecting-IP. Trust it only from Cloudflare's
# ranges (current list: https://www.cloudflare.com/ips/).
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

upstream rb_cloudapi {
    server 127.0.0.1:8080;
    keepalive 16;
}

upstream rb_admin {
    server 127.0.0.1:8443;
    keepalive 4;
}

# Anything that is not one of our names (scanners, the bare IP): close the connection.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# Kiosk APIs. rb-cloudapi serves every API on one flat route table whatever the host name, so all names share
# one upstream; Host is passed through for its logs.
server {
    listen 80;
    listen [::]:80;
    server_name proxyservice.example.net transactionservice.example.net kioskinventory.example.net
                dataservice.example.net adserver.example.net reels.example.net
                iotcertificateservice.example.net files.example.net kioskservices.example.net
                tickets.example.net;

    access_log /var/log/nginx/redbox-kiosk.access.log;
    error_log  /var/log/nginx/redbox-kiosk.error.log;

    # Kiosk uploads (S3 PUT of logs and files) and file-set downloads: stream both ways, no size cap here
    # (Cloudflare's own request limit still applies: 100 MB on Free and Pro).
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;    # Cloudflare gives up after 100 s anyway
    proxy_send_timeout 120s;

    location / {
        proxy_pass http://rb_cloudapi;
    }
}

# Admin dashboard. Put a Cloudflare Access application in front of this name as well (docs/deploy-linux.md).
server {
    listen 80;
    listen [::]:80;
    server_name admin.example.net;

    access_log /var/log/nginx/redbox-admin.access.log;
    error_log  /var/log/nginx/redbox-admin.error.log;

    client_max_body_size 100m;  # revision uploads; Cloudflare refuses more than 100 MB per request (Free/Pro)
    proxy_request_buffering off;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 120s;

    location / {
        proxy_pass http://rb_admin;
    }
}
