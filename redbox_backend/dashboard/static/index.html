<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redbox Control Center</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="login" class="login hidden">
  <form id="login-form" class="card login-card">
    <div class="logo"><span class="mark">r.</span><span class="word">redbox<i>.</i></span></div>
    <h2>Control center</h2>
    <p class="muted" style="margin:6px 0 10px">Self-hosted kiosk backend</p>
    <label>User name <input id="login-user" name="username" autocomplete="username" value="admin" required></label>
    <label>Password <input id="login-pass" name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit" class="primary">Log in</button>
    <p id="login-error" class="error"></p>
  </form>
</div>
<div id="shell" class="shell hidden">
  <aside class="side">
    <div class="logo"><span class="mark">r.</span><span class="word">redbox<i>.</i></span></div>
    <div id="nav"></div>
    <div class="foot">
      <a id="health" class="health" href="#/system"><span class="dot off"></span>Checking services...</a>
      <div class="me"><div class="avatar" id="me-avatar"></div><div><div class="who" id="me"></div><div class="role" id="me-role"></div></div>
        <button id="logout" class="sm out" title="Log out">Log out</button></div>
    </div>
  </aside>
  <main><section id="view"></section></main>
</div>
<div id="modal" class="modal hidden"><div class="modal-body"><div id="modal-content"></div></div></div>
<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body>
</html>
